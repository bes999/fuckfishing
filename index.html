    (function() {
      var t = localStorage.getItem('theme_ff') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();

</head>
<body>

  <div id="app">
    <!-- Main pages -->
    <div id="p-home"    class="page"></div>
    <div id="p-trips"   class="page"></div>
    <div id="p-profile" class="page"></div>

    <!-- Trip pages (inside trip) -->

    <div id="p-rivers"  class="page"></div>
    <div id="p-menu"    class="page"></div>
    <div id="p-more"    class="page"></div>
    <div id="p-recipes" class="page"></div>
    <div id="p-menu-trip" class="page"></div>
    <div id="p-shopping" class="page"></div>
    <div id="p-expenses" class="page"></div>
    <div id="p-catches" class="page"></div>

    <!-- Legacy pages -->
    <div id="p-members" class="page"></div>
    <div id="p-medkit"  class="page"></div>
    <div id="p-bar" class="page"></div>
    <div id="p-safety"  class="page"></div>
    <div id="p-gear" class="page"></div>
  </div>

  <!-- Navigation (рендерится сюда) -->

  <!-- ── Auth module ── -->

  <script src="modules/medkit/emergency.js"></script>
  <script src="modules/medkit/state.js"></script>
  <script src="modules/medkit/status.js"></script>
  <script src="modules/medkit/actions.js"></script>
  <script src="modules/medkit/import.js"></script>
  <script src="modules/medkit/firebase.js"></script>
  <script src="modules/medkit/render.js"></script>
  <script src="modules/medkit/index.js"></script>

  <!-- ── Trips data (shared between home & trips pages) ── -->

  <!-- ── Navigation ── -->

  <!-- ── Home module ── -->

  <!-- ── Rivers module ── -->

  <!-- ── Bar module ── -->

  <script src="modules/bar/state.js"></script>
  <script src="modules/bar/firebase.js"></script>

  <script src="modules/recipes/index.js"></script>

  <!-- ── Menu module ── -->

  <!-- ── Shopping module ── -->
  <script src="modules/shopping/data.js"></script>

  <!-- ── Expenses module ── -->

  <!-- ── Safety module ── -->
  <script src="modules/safety/render.js"></script>
  <script src="modules/safety/index.js"></script>

  <!-- ── App init ── -->
  <script>
    'use strict';

    // Роутер страниц
    const AppRouter = {
      _current: null,

      show(pageId) {
      if (this._current) {
      document.getElementById('p-' + this._current)?.classList.remove('active');
      }
      const el = document.getElementById('p-' + pageId);
      if (el) el.classList.add('active');
      this._current = pageId;
      window.scrollTo(0, 0);
      if (el) el.scrollTop = 0;
      }
    };

    // Навигация — обработчик переключения
    function onNavigate(pageId) {
      // Закрываем любые открытые оверлеи при навигации
      document.getElementById('create-overlay')?.remove();
      document.getElementById('trip-cover')?.remove();

      if (pageId === 'home') {
        AppNav.setMode('main', 'home');
        AppRouter.show('home');
        HomeIndex.refresh();
      } else if (pageId === 'trips') {
        AppRouter.show('trips');
        TripsIndex.render();
      } else if (pageId === 'profile') {
        AppRouter.show('members');
        const uid = window.APP?.profile?.uid;
        if (uid && typeof MembersRender !== 'undefined') {
          MembersRender.showProfile(uid, uid);
        }
      } else if (pageId === 'guide') {
        AppRouter.show('guide');
      } else if (pageId === 'rivers') {
        AppRouter.show('rivers');
        const tripId   = window.APP?.currentTripId   || null;
        const tripData = window.APP?.currentTripData  || null;
        RiversIndex.init(
          document.getElementById('p-rivers'),
          tripData,
          tripId
        );
      } else if (pageId === 'menu') {
      AppRouter.show('menu');
      MenuIndex.show(document.getElementById('p-menu'), window.APP?.currentTripId);
      
      } else if (pageId === 'more') {
   AppRouter.show('more');
  const items = [
    { id:'bar',      label:'Бар',          icon:'ti-glass-full',     ready:true  },
    { id:'recipes',  label:'Рецепты',      icon:'ti-clipboard-list', ready:true },
    { id:'catch',    label:'Улов',         icon:'ti-fish',           ready:true },
    { id:'gear',     label:'Снаряга',      icon:'ti-backpack',       ready:true  },
    { id:'expenses', label:'Расходы',      icon:'ti-credit-card',    ready:true },
    { id:'members',  label:'Участники',    icon:'ti-users',          ready:true  },
    { id:'medkit',   label:'Аптечка',      icon:'ti-first-aid-kit',  ready:true  },
    { id:'safety',   label:'Безопасность', icon:'ti-shield',         ready:true  },
    { id:'menu',     label:'Меню',         icon:'ti-clipboard-list', ready:true },
    { id:'storage',  label:'Закупка',      icon:'ti-shopping-cart', ready:true },
  
  ];
  document.getElementById('p-more').innerHTML = `
    <div style="background:var(--topbar-bg);padding:48px 16px 14px">
      <div style="color:#fff;font-size:18px;font-weight:700">Ещё</div>
    </div>
    <div style="padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      ${items.map(it => `
        <div data-more-id="${it.id}" style="background:var(--bg2);border-radius:14px;border:0.5px solid var(--sep);padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;aspect-ratio:1">
          ${it.ready ? `<div style="width:6px;height:6px;border-radius:50%;background:#34c759;position:absolute;top:8px;right:8px"></div>` : ''}
          <div style="width:42px;height:42px;border-radius:12px;background:${it.ready ? 'var(--accent-bg)' : 'rgba(128,128,128,0.08)'};display:flex;align-items:center;justify-content:center">
            <i class="ti ${it.icon}" style="font-size:21px;color:${it.ready ? 'var(--accent)' : 'var(--label4)'}"></i>
          </div>
          <div style="font-size:12px;font-weight:500;color:${it.ready ? 'var(--label)' : 'var(--label4)'};text-align:center">${it.label}</div>
        </div>`).join('')}
    </div>`;
  document.getElementById('p-more').querySelectorAll('[data-more-id]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.moreId;
      if (id === 'bar') { AppRouter.show('bar'); BarIndex.show(document.getElementById('p-bar')); }
      else if (id === 'gear') {AppRouter.show('gear'); const uid = window.APP?.profile?.uid; if (uid) GearModule.init(uid, true, document.getElementById('p-gear'));}
      else if (id === 'medkit') { AppRouter.show('medkit'); if (typeof rMedkit === 'function') rMedkit(); }
      else if (id === 'members') { AppRouter.show('members'); const uid = window.APP?.profile?.uid; if (uid) MembersRender.showProfile(uid, uid); }
      else if (id === 'recipes') { AppRouter.show('recipes'); RecipesIndex.show(document.getElementById('p-recipes')); }
      else if (id === 'menu') { AppRouter.show('menu'); MenuIndex.show(document.getElementById('p-menu'), window.APP?.currentTripId); }
      else if (id === 'storage') { AppRouter.show('shopping'); ShoppingIndex.show(document.getElementById('p-shopping'), window.APP?.currentTripId); }
      else if (id === 'expenses') { AppRouter.show('expenses'); ExpensesIndex.show(document.getElementById('p-expenses'), window.APP?.currentTripId); }
      else if (id === 'catch') { AppRouter.show('catches'); CatchesIndex.show(document.getElementById('p-catches'), window.APP?.currentTripId); }
      else if (id === 'safety') { AppRouter.show('safety'); SafetyIndex.show(document.getElementById('p-safety'), () => onNavigate('more')); }
    });
  });
  }
      AppNav.setActive(pageId);
    }

    // Запуск после авторизации
    function startApp(user) {
      // Загружаем данные
      TripsData.load();

      // Инициализируем навбар
      AppNav.init(onNavigate);

      // Показываем главную
      AppRouter.show('home');
      HomeIndex.init(document.getElementById('p-home'), user);

      // Инициализируем страницу поездок (лениво)
      TripsIndex.init(document.getElementById('p-trips'));
    }

    // Запуск auth (startApp будет вызван из _boot() в auth/index.js)
    AuthActions.init();
  </script>

</body>
</html>
