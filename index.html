  <!-- ── App init ── -->
  <script>
    'use strict';

    // Роутер страниц
    const AppRouter = {
      _current: null,

      show(pageId) {
      if (this._current) {
      document.getElementById('p-' + this._current)?.classList.remove('active');
      }
      const el = document.getElementById('p-' + pageId);
      if (el) el.classList.add('active');
      this._current = pageId;
      window.scrollTo(0, 0);
      if (el) el.scrollTop = 0;
      }
    };

    // Раздел статичного нижнего таббара, который нужно подсветить для
    // каждого pageId. Разделы поездки (rivers/menu/...) подсвечивают ту же
    // вкладку "Поездка", что и guide — они все её продолжение. Разделы без
    // записи здесь (bar/recipes/gear/profile/...) не меняют текущую подсветку —
    // профиль больше не отдельная вкладка таббара, он открывается тапом
    // по аватару в шапке (AppHeader).
    const BOTTOM_TAB_FOR = {
      home: 'home', trips: 'trips',
      guide: 'guide', rivers: 'guide', menu: 'guide',
      catches: 'guide', expenses: 'guide', shopping: 'guide',
    };

    // Навигация — единая точка входа для нижнего таббара И для
    // выезжающего меню (AppHeader) — оба вызывают onNavigate(id).
    function onNavigate(pageId) {
      // Закрываем любые открытые оверлеи при навигации
      document.getElementById('create-overlay')?.remove();
      document.getElementById('trip-cover')?.remove();
      if (typeof AppHeader !== 'undefined') AppHeader.closeDrawer();

      const tripId = window.APP?.currentTripId || null;

      if (pageId === 'home') {
        AppRouter.show('home');
        HomeIndex.refresh();
      } else if (pageId === 'trips') {
        AppRouter.show('trips');
        TripsIndex.render();
      } else if (pageId === 'guide') {
        // Нижняя вкладка "Поездка" вне контекста поездки — быстрый попап
        // выбора (или сразу внутрь, если актуальная поездка одна)
        if (!tripId) {
          if (typeof TripCoverIndex !== 'undefined') TripCoverIndex.showQuickPicker();
          else onNavigate('trips');
          return;
        }
        AppRouter.show('guide');
      } else if (pageId === 'profile') {
        AppRouter.show('members');
        const uid = window.APP?.profile?.uid;
        if (uid && typeof MembersRender !== 'undefined') {
          MembersRender.showProfile(uid, uid);
        }
      } else if (pageId === 'members') {
        // Список участников поездки — отдельно от "мой профиль"
        AppRouter.show('members');
        if (typeof MembersModule !== 'undefined') {
          MembersModule.showList(document.getElementById('p-members'));
        }
      } else if (pageId === 'rivers') {
        AppRouter.show('rivers');
        const tripData = window.APP?.currentTripData || null;
        RiversIndex.init(document.getElementById('p-rivers'), tripData, tripId);
      } else if (pageId === 'menu') {
        AppRouter.show('menu');
        MenuIndex.show(document.getElementById('p-menu'), tripId);
      } else if (pageId === 'shopping') {
        AppRouter.show('shopping');
        ShoppingIndex.show(document.getElementById('p-shopping'), tripId);
      } else if (pageId === 'expenses') {
        AppRouter.show('expenses');
        ExpensesIndex.show(document.getElementById('p-expenses'), tripId);
      } else if (pageId === 'catches') {
        AppRouter.show('catches');
        CatchesIndex.show(document.getElementById('p-catches'), tripId);
      } else if (pageId === 'bar') {
        AppRouter.show('bar');
        BarIndex.show(document.getElementById('p-bar'));
      } else if (pageId === 'recipes') {
        AppRouter.show('recipes');
        RecipesIndex.show(document.getElementById('p-recipes'));
      } else if (pageId === 'gear') {
        AppRouter.show('gear');
        const uid = window.APP?.profile?.uid;
        const openTrip = window.APP?._gearOpenTrip || null;
        if (window.APP) window.APP._gearOpenTrip = null;
        if (uid) GearModule.init(uid, true, document.getElementById('p-gear'), openTrip);
      } else if (pageId === 'medkit') {
        AppRouter.show('medkit');
        if (typeof rMedkit === 'function') rMedkit();
      } else if (pageId === 'medkit-reference') {
        AppRouter.show('medkit');
        if (typeof setMedkitMode === 'function') setMedkitMode('reference');
      } else if (pageId === 'safety') {
        AppRouter.show('safety');
        SafetyIndex.show(document.getElementById('p-safety'), () => onNavigate('home'));
      }

      const tabId = BOTTOM_TAB_FOR[pageId];
      if (tabId) AppNav.setActive(tabId);
    }

    // Запуск после авторизации
    let _tripsBooted = false;

    function startApp(user) {
      // Реалтайм-подписка на поездки (Firestore) — держим кэш (TripsState)
      // актуальным на весь сеанс. До первого снапшота — просто наполняем
      // кэш молча; после того как страницы уже инициализированы (см. ниже),
      // каждый новый снапшот перерисовывает Главную и Поездки.
      TripsFirebase.listen(trips => {
        TripsState.setTrips(trips);
        if (_tripsBooted) {
          if (typeof HomeIndex !== 'undefined') HomeIndex.refresh();
          if (typeof TripsIndex !== 'undefined') TripsIndex.render();
        }
      });

      // Ждём первый снапшот (обычно почти мгновенно — офлайн-персистентность
      // включена в shared/config.js), затем один раз мигрируем локальные
      // поездки, которых ещё нет в Firestore, и только после этого
      // инициализируем страницы — так сохраняется прежняя гарантия "к
      // моменту первого рендера данные уже есть".
      TripsFirebase.ready()
        .then(() => TripsData.migrateFromLocalStorage())
        .then(() => TripsData.backfillOwnerId())
        .catch(() => {})
        .then(() => {
          AppNav.init(onNavigate);
          AppHeader.init(onNavigate);

          AppRouter.show('home');
          HomeIndex.init(document.getElementById('p-home'), user);

          TripsIndex.init(document.getElementById('p-trips'));

          _tripsBooted = true;

          _processJoinInvite();
        });
    }

    // Ссылка-приглашение в конкретную поездку (?joinTrip=<id>) — переживает
    // и Google-попап, и онбординг нового пользователя, т.к. ни то, ни
    // другое не уводит со страницы. Обрабатывается один раз здесь, когда
    // кэш поездок уже точно наполнен.
    function _processJoinInvite() {
      const tripId = new URLSearchParams(location.search).get('joinTrip');
      if (!tripId) return;

      // Чистим URL сразу — обновление страницы не должно повторять вступление
      history.replaceState(null, '', location.pathname + location.hash);

      const trip = TripsData.getById(tripId);
      if (!trip) { alert('Ссылка на поездку недействительна — возможно, поездку удалили.'); return; }

      const uid  = window.APP?.user?.uid;
      const name = window.APP?.profile?.displayName || '';

      if (uid && (trip.memberIds || []).includes(uid)) {
        TripCoverIndex.show(tripId);
        return;
      }

      UIUtils.confirmSheet(`Присоединиться к поездке «${trip.name}»?`, {
        title: 'Приглашение в поездку', okLabel: 'Присоединиться', danger: false
      }).then(ok => {
        if (!ok) return;
        TripsData.addParticipant(tripId, { uid, name })
          .then(() => TripCoverIndex.show(tripId));
      });
    }

    // Запуск auth (startApp будет вызван из _boot() в auth/index.js)
    AuthActions.init();
  </script>
